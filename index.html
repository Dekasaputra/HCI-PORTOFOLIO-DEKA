<script>
    const menuToggle = document.getElementById("menuToggle");
    const menuTrack = document.getElementById("menuTrack");
    const scrollLeft = document.getElementById("scrollLeft");
    const scrollRight = document.getElementById("scrollRight");

    menuToggle.addEventListener("click", function() {
        menuTrack.classList.toggle("is-hidden");

        const expanded = !menuTrack.classList.contains("is-hidden");

        menuToggle.setAttribute("aria-expanded", expanded);
        scrollLeft.hidden = !expanded;
        scrollRight.hidden = !expanded;
    });

    scrollRight.addEventListener("click", function() {
        menuTrack.scrollBy({
            left: 240,
            behavior: "smooth"
        });
    });

    scrollLeft.addEventListener("click", function() {
        menuTrack.scrollBy({
            left: -240,
            behavior: "smooth"
        });
    });
</script>

<script>
    const popupOverlay = document.getElementById("popupOverlay");
    const popupClose = document.getElementById("popupClose");
    const popupTitle = document.getElementById("popupTitle");
    const popupContent = document.getElementById("popupContent");

    const popupTitles = {
        "about-me": "About Me",
        "skills": "My Skills",
        "projects": "My Projects",
        "contact": "Contact Me"
    };

    let previousFocus = null;

    function openPopup(id) {
        const template = document.getElementById(id + "-content");

        if (!template) return;

        previousFocus = document.activeElement;
        popupTitle.textContent = popupTitles[id];
        popupContent.replaceChildren(
            template.content.cloneNode(true)
        );

        popupOverlay.hidden = false;
        document.body.classList.add("popup-open");
        popupClose.focus();
    }

    function closePopup() {
        popupOverlay.hidden = true;
        document.body.classList.remove("popup-open");
        popupContent.replaceChildren();

        if (previousFocus) previousFocus.focus();
    }

    document.querySelectorAll("[data-popup]").forEach(button => {
        button.addEventListener("click", function(event) {
            event.preventDefault();
            openPopup(this.dataset.popup);
        });
    });

    popupClose.addEventListener("click", closePopup);

    popupOverlay.addEventListener("click", function(event) {
        if (event.target === popupOverlay) {
            closePopup();
        }
    });

    document.addEventListener("keydown", function(event) {
        if (popupOverlay.hidden) return;

        if (event.key === "Escape") {
            closePopup();
        }

        if (event.key === "Tab") {
            const controls = popupOverlay.querySelectorAll(
                'a[href], button:not([disabled]), input, textarea, select, [tabindex]:not([tabindex="-1"])'
            );

            const first = controls[0];
            const last = controls[controls.length - 1];

            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }
    });

    // Make the main Contact button open the same popup
    document.querySelectorAll('a.primary-btn[href="#contact"]')
        .forEach(button => {
            button.addEventListener("click", function(event) {
                event.preventDefault();
                openPopup("contact");
            });
        });
</script>

<script>
    document.getElementById("popupContent")
        .addEventListener("click", async function(event) {

            const button = event.target.closest(".contact-box");

            if (!button) return;

            const value = button.getAttribute("data-copy");
            const label = button.querySelector(".copy-label");

            try {
                await navigator.clipboard.writeText(value);

                label.textContent = "Copied!";
                label.style.color = "#ffd700";

                setTimeout(function() {
                    label.textContent = "Click to copy";
                    label.style.color = "#10fe03";
                }, 1500);

            } catch (error) {
                label.textContent = "Copy failed";
                console.error("Clipboard error:", error);
            }
        });
</script>
